<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .mode-select {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .mode-btn {
      padding: 0.5rem 1.2rem;
      border: 2px solid #e94560;
      background: transparent;
      color: #e94560;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .mode-btn.active, .mode-btn:hover {
      background: #e94560;
      color: #fff;
    }

    .status {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      height: 1.6rem;
      color: #aaa;
    }

    .status.winner { color: #e94560; font-weight: bold; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) { background: #0f3460; transform: scale(1.05); }
    .cell.taken { cursor: default; }
    .cell.x { color: #e94560; }
    .cell.o { color: #4fc3f7; }
    .cell.win { background: #1e3a5f; box-shadow: 0 0 12px rgba(233,69,96,0.5); }

    .reset-btn {
      margin-top: 1.5rem;
      padding: 0.6rem 2rem;
      background: #e94560;
      border: none;
      color: #fff;
      border-radius: 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .reset-btn:hover { opacity: 0.85; }

    .score {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      color: #aaa;
    }

    .score span { font-weight: bold; }
    .score .x-score span { color: #e94560; }
    .score .o-score span { color: #4fc3f7; }
    .score .draw-score span { color: #aaa; }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>

  <div class="mode-select">
    <button class="mode-btn active" id="btn-pvp" onclick="setMode('pvp')">2 Spieler</button>
    <button class="mode-btn" id="btn-ai" onclick="setMode('ai')">Gegen KI</button>
  </div>

  <div class="score">
    <div class="x-score">X: <span id="score-x">0</span></div>
    <div class="draw-score">Unentschieden: <span id="score-d">0</span></div>
    <div class="o-score">O: <span id="score-o">0</span></div>
  </div>

  <div class="status" id="status">Spieler X ist dran</div>

  <div class="board" id="board">
    <div class="cell" onclick="handleClick(0)"></div>
    <div class="cell" onclick="handleClick(1)"></div>
    <div class="cell" onclick="handleClick(2)"></div>
    <div class="cell" onclick="handleClick(3)"></div>
    <div class="cell" onclick="handleClick(4)"></div>
    <div class="cell" onclick="handleClick(5)"></div>
    <div class="cell" onclick="handleClick(6)"></div>
    <div class="cell" onclick="handleClick(7)"></div>
    <div class="cell" onclick="handleClick(8)"></div>
  </div>

  <button class="reset-btn" onclick="reset()">Neu starten</button>

  <script>
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board, current, gameOver, mode;
    let scores = { X: 0, O: 0, D: 0 };

    function setMode(m) {
      mode = m;
      document.getElementById('btn-pvp').classList.toggle('active', m === 'pvp');
      document.getElementById('btn-ai').classList.toggle('active', m === 'ai');
      reset();
    }

    function reset() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      document.getElementById('status').className = 'status';
      render();
      updateStatus();
    }

    function render() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((c, i) => {
        c.textContent = board[i] === 'X' ? '✕' : board[i] === 'O' ? '○' : '';
        c.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
      });
    }

    function updateStatus(winLine) {
      const el = document.getElementById('status');
      if (winLine) {
        el.className = 'status winner';
        el.textContent = (mode === 'ai' && current === 'O') ? 'KI gewinnt!' : `Spieler ${current} gewinnt!`;
        winLine.forEach(i => document.querySelectorAll('.cell')[i].classList.add('win'));
      } else if (board.every(Boolean)) {
        el.className = 'status winner';
        el.textContent = 'Unentschieden!';
      } else {
        const label = (mode === 'ai' && current === 'O') ? 'KI' : `Spieler ${current}`;
        el.textContent = `${label} ist dran`;
      }
    }

    function handleClick(i) {
      if (gameOver || board[i]) return;
      if (mode === 'ai' && current === 'O') return;
      makeMove(i);
      if (!gameOver && mode === 'ai' && current === 'O') {
        setTimeout(aiMove, 350);
      }
    }

    function makeMove(i) {
      board[i] = current;
      render();
      const win = checkWin();
      if (win) {
        gameOver = true;
        scores[current]++;
        updateScores();
        updateStatus(win);
        return;
      }
      if (board.every(Boolean)) {
        gameOver = true;
        scores.D++;
        updateScores();
        updateStatus();
        return;
      }
      current = current === 'X' ? 'O' : 'X';
      updateStatus();
    }

    function checkWin() {
      for (const line of WINS) {
        if (line.every(i => board[i] === current)) return line;
      }
      return null;
    }

    function updateScores() {
      document.getElementById('score-x').textContent = scores.X;
      document.getElementById('score-o').textContent = scores.O;
      document.getElementById('score-d').textContent = scores.D;
    }

    // Minimax AI
    function aiMove() {
      const best = minimax(board, 'O', 0);
      makeMove(best.index);
    }

    function minimax(b, player, depth) {
      const winner = getWinner(b);
      if (winner === 'O') return { score: 10 - depth };
      if (winner === 'X') return { score: depth - 10 };
      const empty = b.map((v, i) => v === null ? i : null).filter(v => v !== null);
      if (empty.length === 0) return { score: 0 };

      const moves = empty.map(i => {
        const nb = [...b];
        nb[i] = player;
        const result = minimax(nb, player === 'O' ? 'X' : 'O', depth + 1);
        return { index: i, score: result.score };
      });

      return moves.reduce((best, m) =>
        player === 'O' ? (m.score > best.score ? m : best)
                       : (m.score < best.score ? m : best)
      );
    }

    function getWinner(b) {
      for (const line of WINS) {
        if (b[line[0]] && b[line[0]] === b[line[1]] && b[line[1]] === b[line[2]])
          return b[line[0]];
      }
      return null;
    }

    // Init
    mode = 'pvp';
    reset();
  </script>
</body>
</html>
